#
# 快速参考:
# - 修改股票池: 编辑 hikyuu.instruments
# - 修改时间范围: 编辑 dataset.quick.segments
# - 修改选股数量: 编辑 signals.top_k
# - 优化模型: 编辑 model.kwargs
# - 切换运行模式: 编辑 run_modes.default (quick/full)
#
# 重新运行: python scripts/run_all.py
# 结果分析: python scripts/analyze_results.py
# 查看报告: open reports/latest/review.html
