run_modes:
  default: quick
  supported: [quick, full]

workflow:
  steps: [check, prepare, train, features, signals, backtest, summary, review, report, monitor, decision]

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  output_dir: data
  features_dir: features
  data_source: hikyuu

features:
  template: config/templates/default_indicators.yaml
  output: features/features.csv
  templates:
    - config/templates/default_indicators.yaml
    - config/templates/basic_volume.yaml
    - config/templates/advanced_momentum.yaml

signals:
  output: artifacts/signals.csv
  top_k: 3
  top_k_sell: 3

reports:
  summary: reports/latest/backtest_summary.json
  html: reports/latest/review.html
  detail: reports/latest/review_detail.html
  report: reports/latest/performance_report.html
  benchmark:
    symbol: SH000300
    csv: data/benchmark_SH000300.csv

monitor:
  summary: reports/latest/backtest_summary.json
  metrics: experiments/latest/metrics.json
  output: reports/latest/monitoring.json
  min_signals: 10
  min_rows: 100
  max_loss: 1.0
  history: reports/latest/monitoring_history.csv
  chart: reports/latest/monitoring_chart.html
  history_limit: 100

compare:
  baseline: reports/baseline/backtest_summary.json
  output: reports/latest/compare.csv

decision:
  report: artifacts/review_decision.json
  approved: artifacts/approved_signals.csv
  auto: true

experiments:
  base: experiments

hikyuu:
  instruments: [SH600000, SH600009, SZ000001, SZ000002]

dataset:
  quick:
    instruments: csi100
    start_time: "2012-01-01"
    end_time: "2020-12-31"
    fit_start_time: "2012-01-01"
    fit_end_time: "2017-12-31"
    segments:
      train: ["2012-01-01", "2017-12-31"]
      valid: ["2018-01-01", "2018-12-31"]
      test: ["2019-01-01", "2020-12-31"]
  full:
    instruments: csi300
    start_time: "2010-01-01"
    end_time: "2022-12-31"
    fit_start_time: "2010-01-01"
    fit_end_time: "2018-12-31"
    segments:
      train: ["2010-01-01", "2018-12-31"]
      valid: ["2019-01-01", "2019-12-31"]
      test: ["2020-01-01", "2022-12-31"]

model:
  class: LGBModel
  module_path: qlib.contrib.model.gbdt
  kwargs:
    loss: mse
    colsample_bytree: 0.8879
    learning_rate: 0.0421
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    n_estimators: 200
