# -----------------------------------------------------------------------------
# 数据集配置（时间范围和股票池）
# -----------------------------------------------------------------------------
dataset:
  # --- 快速模式 (当前使用) ---
  # 适合: 日常开发、快速验证、参数调优
  quick:
    # 股票池配置（此处配置会被 hikyuu.instruments 覆盖）
    # csi100: 中证100指数成分股
    instruments: csi100

    # 数据时间范围
    # 说明: 从2015年开始是为了避免2015年股灾前的异常数据
    start_time: "2015-01-01"  # 数据开始日期
    end_time: "2023-12-31"    # 数据结束日期

    # 模型拟合时间范围（用于Qlib内部处理）
    fit_start_time: "2015-01-01"
    fit_end_time: "2020-12-31"

    # 数据集划分（训练集/验证集/测试集）
    # 重要: 严格的时间顺序，避免前视偏差
    segments:
      # 训练集: 6年数据 (2015-2020)
      # 用途: 训练模型，学习历史规律
      train: ["2015-01-01", "2020-12-31"]

      # 验证集: 1年数据 (2021)
      # 用途: 调整模型参数，防止过拟合
      # 包含: 疫情后市场环境
      valid: ["2021-01-01", "2021-12-31"]

      # 测试集: 2年数据 (2022-2023)
      # 用途: 评估策略真实表现
      # 包含: 最新市场环境（2022年熊市，2023年复苏）
      test: ["2022-01-01", "2023-12-31"]

  # --- 完整模式 ---
  # 适合: 正式回测、策略发布、论文研究
  full:
    # 股票池: 沪深300成分股（~300只股票）
    instruments: csi300

    # 数据时间范围: 13年完整周期
    start_time: "2010-01-01"
    end_time: "2022-12-31"

    fit_start_time: "2010-01-01"
    fit_end_time: "2018-12-31"

    # 数据集划分
    segments:
      # 训练集: 9年数据 (2010-2018)
      # 覆盖: 多轮牛熊市完整周期
      train: ["2010-01-01", "2018-12-31"]

      # 验证集: 1年数据 (2019)
      # 2019年结构性牛市
      valid: ["2019-01-01", "2019-12-31"]

      # 测试集: 3年数据 (2020-2022)
      # 覆盖: 疫情冲击、熊市调整
      test: ["2020-01-01", "2022-12-31"]

  # --- 中证1000模式 ---
  # 适合: 中小盘全面策略、多因子挖掘、大数据回测
  csi1000:
    # 股票池: 中证500指数成分股（~500只中盘股票）
    # 注意: Qlib数据不包含csi1000，使用csi500代替
    # 特点: 市值中等，流动性好，波动性适中
    instruments: csi500

    # 数据时间范围: 调整为Qlib数据实际范围（2000-2020-09-25）
    # 注意: Qlib cn_data最新数据只到2020年9月，无法使用2021-2023数据
    start_time: "2018-01-01"
    end_time: "2020-09-25"

    fit_start_time: "2018-01-01"
    fit_end_time: "2019-12-31"

    # 数据集划分（调整为Qlib数据实际范围）
    segments:
      # 训练集: 2年数据 (2018-2019)
      # 覆盖: 2018熊市、2019结构牛
      train: ["2018-01-01", "2019-12-31"]

      # 验证集: 6个月数据 (2020年上半年)
      # 2020年初疫情冲击
      valid: ["2020-01-01", "2020-06-30"]

      # 测试集: 3个月数据 (2020年下半年)
      # 疫情后复苏阶段
      test: ["2020-07-01", "2020-09-25"]

# 💡 时间范围选择建议:
# - 训练集: 至少5年，覆盖完整牛熊周期
# - 验证集: 1-2年，用于参数调优
# - 测试集: 1-3年，评估最新市场表现
# - 训练:验证:测试 推荐比例 = 6:1:2 或 7:1:2

# -----------------------------------------------------------------------------
# 模型配置 (LightGBM)
# -----------------------------------------------------------------------------
model:
  # 模型类名（不要修改）
  class: LGBModel

  # 模型所在模块（不要修改）
  module_path: qlib.contrib.model.gbdt

  # LightGBM模型参数
  # 参考: https://lightgbm.readthedocs.io/en/latest/Parameters.html
  kwargs:
    # 损失函数
    # - mse: 均方误差（回归任务，预测收益率）
    # - binary: 二分类（预测涨跌）
    loss: mse

    # 特征采样比例（防止过拟合）
    # 范围: 0.0-1.0
    # 0.8879: 每棵树随机使用88.79%的特征
    # 建议: 0.8-0.95（特征少时用高值，特征多时用低值）
    colsample_bytree: 0.8879

    # 学习率（控制训练速度和收敛性）
    # 范围: 0.001-0.3
    # 0.0421: 较小的学习率，训练更稳定但需要更多迭代
    # 建议: 数据量大时可降至0.01-0.02，小数据集用0.05-0.1
    # 中证1000（大数据）: 0.01-0.02
    learning_rate: 0.02  # 中证1000优化值

    # 样本采样比例（防止过拟合）
    # 范围: 0.0-1.0
    # 0.8789: 每棵树随机使用87.89%的样本
    # 建议: 0.8-0.95
    subsample: 0.8789

    # L1正则化系数（特征稀疏化）
    # 范围: >=0
    # 205.6999: 较大的L1正则，鼓励特征选择
    # 作用: 值越大，越多特征权重被压缩到0
    lambda_l1: 205.6999

    # L2正则化系数（防止过拟合）
    # 范围: >=0
    # 580.9768: 较大的L2正则，平滑模型
    # 作用: 值越大，特征权重越平滑
    lambda_l2: 580.9768

    # 树的最大深度（控制模型复杂度）
    # 范围: >0
    # 8: 较深的树，可以捕捉复杂模式
    # 建议: 简单数据3-5，复杂数据6-10，过深易过拟合
    max_depth: 8

    # 叶子节点数量（控制模型复杂度）
    # 范围: >0
    # 210: 较多的叶子，模型表达能力强
    # 建议: 2^max_depth 左右，与max_depth配合使用
    # 注意: num_leaves 应该 < 2^max_depth
    num_leaves: 210

    # 迭代次数（boosting轮数）
    # 范围: >0
    # 200: 200棵树
    # 建议: 配合early_stopping使用，设置较大值(500-1000)
    # 性能: 越大训练越慢，但模型越准确（到一定程度后收益递减）
    # 中证1000（大数据）: 500-1000
    n_estimators: 500  # 中证1000优化值

# 💡 模型调优建议:
#
# 1. 提升性能（数据量从8K→62K后）:
#    n_estimators: 200 → 500
#    max_depth: 8 → 10
#    learning_rate: 0.0421 → 0.02
#
# 2. 防止过拟合:
#    增加 lambda_l1, lambda_l2
#    降低 max_depth, num_leaves
#    降低 colsample_bytree, subsample
#
# 3. 加快训练:
#    增加 learning_rate (0.05-0.1)
#    减少 n_estimators
#    减少 max_depth
#
# 4. 使用GPU加速:
#    添加 device: "gpu"
#    添加 gpu_platform_id: 0
#    添加 gpu_device_id: 0

# =============================================================================
# 配置文件结束
