# =============================================================================
# Qlib-Hikyuu 集成框架 - 主配置文件
# =============================================================================
#
# 本配置文件定义了整个量化交易系统的运行参数，包括：
# - 数据源配置
# - 股票池选择
# - 时间范围设置
# - 模型参数
# - 工作流程配置
#
# 修改后需重新运行: python scripts/run_all.py
# =============================================================================

# -----------------------------------------------------------------------------
# 运行模式配置
# -----------------------------------------------------------------------------
run_modes:
  # 默认运行模式
  # - quick: 快速模式（50股票，2015-2023）- 适合日常开发测试
  # - full: 完整模式（300股票，2010-2022）- 适合正式回测
  # - csi1000: 中证1000模式（1000股票，2018-2023）- 中小盘全面回测
  default: csi1000  # 已切换到中证1000模式

  # 支持的运行模式列表（不要修改）
  supported: [quick, full, csi1000]

# -----------------------------------------------------------------------------
# 工作流程配置
# -----------------------------------------------------------------------------
workflow:
  # 执行步骤（按顺序执行）
  # - check: 环境检查（Python版本、依赖包等）
  # - prepare: 数据准备（从Hikyuu加载并处理数据）
  # - train: 模型训练（使用LightGBM训练预测模型）
  # - features: 特征工程（生成技术指标等特征）
  # - signals: 信号生成（生成交易信号）
  # - backtest: 回测分析（评估策略表现）
  # - summary: 生成摘要（统计关键指标）
  # - review: 生成报告（HTML可视化报告）
  # - decision: 决策审核（自动或人工审核信号）
  steps: [check, prepare, train, features, signals, backtest, summary, review, decision]

# -----------------------------------------------------------------------------
# 数据配置
# -----------------------------------------------------------------------------
data:
  # Qlib数据存储路径（不使用Hikyuu时的备用数据源）
  # ~ 表示用户主目录，会自动扩展为 /Users/xxx 或 /home/xxx
  provider_uri: "~/.qlib/qlib_data/cn_data"

  # 数据输出目录（存放准备好的数据集）
  # 生成文件: prepared_dataset.csv, prepared_dataset.parquet
  output_dir: data

  # 特征文件输出目录
  features_dir: features

  # 数据源类型
  # - hikyuu: 使用Hikyuu数据（推荐，实时中国市场数据）
  # - qlib: 使用Qlib离线数据（支持中证指数：csi100/300/500/800/1000）
  data_source: qlib  # 使用中证1000时必须用qlib

# -----------------------------------------------------------------------------
# 特征工程配置
# -----------------------------------------------------------------------------
features:
  # 默认特征模板文件
  template: config/templates/default_indicators.yaml

  # 特征输出文件路径
  output: features/features.csv

  # 特征模板列表（可以包含多个模板文件）
  # 模板文件定义了要计算的技术指标
  templates:
    - config/templates/default_indicators.yaml      # 基础指标 (MA, RSI等)
    - config/templates/basic_volume.yaml            # 成交量指标
    - config/templates/advanced_momentum.yaml       # 高级动量指标

# -----------------------------------------------------------------------------
# 交易信号配置
# -----------------------------------------------------------------------------
signals:
  # 信号输出文件路径
  output: artifacts/signals.csv

  # 每日选择的股票数量（top-k选股策略）
  # - 3: 每天选择排名前3的股票（分散度低，集中度高）
  # - 5: 每天选择排名前5的股票（更分散）
  # - 10: 每天选择排名前10的股票（高度分散）
  # - 15-25: 中证500建议值（从500只中选15-25只，3-5%选股率）
  # 影响: top_k越大，信号数量越多，单个股票权重越低
  top_k: 20  # 中证500推荐20只（4%选股率）

# -----------------------------------------------------------------------------
# 报告配置
# -----------------------------------------------------------------------------
reports:
  # 回测摘要JSON文件路径（包含关键统计指标）
  summary: reports/latest/backtest_summary.json

  # HTML可视化报告路径（可在浏览器中查看）
  # 使用: open reports/latest/review.html
  html: reports/latest/review.html

# -----------------------------------------------------------------------------
# 决策审核配置
# -----------------------------------------------------------------------------
decision:
  # 审核决策报告路径（记录批准/拒绝的信号数量）
  report: artifacts/review_decision.json

  # 已批准的信号输出路径（仅包含通过审核的信号）
  approved: artifacts/approved_signals.csv

  # 是否自动批准所有信号
  # - true: 自动批准所有信号（无人工干预）
  # - false: 需要人工审核（适合实盘前的最终检查）
  auto: true

# -----------------------------------------------------------------------------
# MLflow实验跟踪配置
# -----------------------------------------------------------------------------
experiments:
  # MLflow实验存储基础目录
  # 每次运行会创建新的实验记录，包含：
  # - 模型参数
  # - 训练指标
  # - 预测结果
  base: experiments

